<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Factory — 動画プレビュー</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topbar">
    <a class="kicker" href="index.html">VIDEO FACTORY</a>
  </div>
  <a class="back-link" href="gallery.html">&larr; ギャラリーに戻る</a>

  <div id="root"></div>

  <script src="app.js"></script>
  <script>
    function pipelineCardsHTML(pipeline) {
      if (!pipeline || !pipeline.length) return "";
      return pipeline.map((stage, i) => `
        <div class="pipeline-card">
          <div class="icon">${String(i + 1).padStart(2, "0")}</div>
          <div class="label">${stage.label}</div>
          <span class="status">${stage.status === "done" ? "DONE" : stage.status.toUpperCase()}</span>
          <div class="split-flap">${splitFlapHTML(stage.duration_sec.toFixed(1) + "s")}</div>
          <div class="pipeline-card-details">
            所要時間: ${stage.duration_sec.toFixed(2)}秒<br />
            状態: ${stage.status}
            ${stage.error ? `<br /><span class="error">${stage.error}</span>` : ""}
          </div>
        </div>
      `).join("");
    }

    function sourcesHTML(sources) {
      if (!sources || !sources.length) return "<p style='color:var(--text-3)'>出典なし</p>";
      return sources.map((s) => `
        <div class="source-row">
          <span>${s.file}</span>
          <span class="source-score">${s.similarity.toFixed(2)}</span>
        </div>
      `).join("");
    }

    async function renderDetail() {
      const root = document.getElementById("root");
      const id = new URLSearchParams(location.search).get("id");
      if (!id) {
        root.innerHTML = `<div class="container"><div class="empty-state">動画IDが指定されていません。</div></div>`;
        return;
      }

      let entry, meta;
      try {
        const manifest = await loadManifest();
        entry = manifest.find((v) => v.id === id);
        if (!entry) throw new Error("manifest に該当IDが見つかりません: " + id);
        meta = await loadVideoMetadata(id);
      } catch (e) {
        root.innerHTML = `<div class="container"><div class="empty-state">読み込みエラー: ${e.message}</div></div>`;
        return;
      }

      // v1: regeneration is an inert affordance showing the exact CLI
      // command, not a live trigger (design doc §5 -- no backend to invoke
      // a local process from a static page).
      const regenCmd = `video_factory_cloudrag_poc.exe "${entry.title}" "houdini21"`;

      root.innerHTML = `
        <div class="detail-layout">
          <div>
            <div class="player-wrap">
              <video src="${entry.video_path}" poster="${entry.thumbnail_path}" controls></video>
            </div>
            <h1 class="detail-title">${entry.title}</h1>
            <div class="tags">${entry.tags.map((t) => `<span class="tag">${t}</span>`).join("")}</div>
            <p class="detail-summary">${meta.narration_summary || ""}</p>

            <div class="panel">
              <h3>生成プロセス</h3>
              ${radialProgressHTML(meta.pipeline)}
              <div class="pipeline-row" id="pipelineRow">${pipelineCardsHTML(meta.pipeline)}</div>
            </div>
          </div>

          <div>
            ${tokenConsumptionHTML([entry], { single: true })}
            <div class="panel">
              <h3>RAG出典</h3>
              ${extractionBadgeHTML(meta.quality)}
              ${sourcesHTML(meta.rag_sources)}
            </div>
            <div class="panel">
              <h3>再生成</h3>
              <button class="regen-btn" onclick="navigator.clipboard.writeText(this.querySelector('code').textContent)">
                コマンドをコピー
                <code>${regenCmd}</code>
              </button>
            </div>
            ${IS_LOCAL_FILE ? "" : `
            <div class="panel">
              <h3>管理</h3>
              <button id="deleteBtn" class="regen-btn" style="color:#b3261e">共有ギャラリーから削除</button>
            </div>
            `}
          </div>
        </div>
      `;

      if (!IS_LOCAL_FILE) {
        document.getElementById("deleteBtn").addEventListener("click", async () => {
          if (!confirm(`「${entry.title}」を共有ギャラリーから削除しますか？元に戻せません。`)) return;
          const ok = await deleteVideoRemote(id);
          if (ok) location.href = "gallery.html";
        });
      }

      wireMorphMenu(document.getElementById("pipelineRow"));
    }

    renderDetail();
  </script>
</body>
</html>
