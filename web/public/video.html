<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Factory — 動画プレビュー</title>
<script>try{var t=localStorage.getItem("vf_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="video">
  <header id="topbar"></header>
  <a class="back-link" id="backLink" href="gallery.html"></a>

  <div id="root"></div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="管理"></aside>

  <script src="app.js"></script>
  <script>
    mountTopbar();
    document.getElementById("backLink").innerHTML = `${icon("arrow-left")}<span>ギャラリーに戻る</span>`;

    function selectTab(root, name) {
      root.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
      root.querySelectorAll("[data-panel]").forEach((p) => { p.hidden = p.dataset.panel !== name; });
    }

    // Management drawer: regeneration command + (separated at the bottom)
    // the destructive action. Delete is a modal-confirmed, shared-gallery-
    // only operation; local files are never deleted from this page.
    function buildDrawer(entry, id) {
      const dbKey = (entry.source_tutorial || "").startsWith("cloud-rag:")
        ? entry.source_tutorial.slice("cloud-rag:".length)
        : (entry.tags && entry.tags[0]) || "houdini21";
      const regenCmd = `video_factory_cloudrag_poc.exe "${entry.title}" "${dbKey}"`;

      const foot = IS_LOCAL_FILE
        ? `<div class="drawer-foot">
             <h3>削除</h3>
             <p>この画面からはPC内の動画ファイルを削除できません。不要な場合は <code>output\\videos\\${escapeHTML(id)}</code> を手動で削除してください。</p>
           </div>`
        : `<div class="drawer-foot">
             <h3>削除</h3>
             <p>共有ギャラリー上の動画・サムネイル・メタデータを削除します。お使いのPCの output フォルダのファイルは削除されません。</p>
             <button type="button" id="deleteBtn" class="btn btn-danger btn-block">${icon("trash")}<span>共有ギャラリーから削除</span></button>
           </div>`;

      document.getElementById("drawer").innerHTML = `
        <div class="drawer-head">
          <h2>管理</h2>
          <button type="button" id="drawerClose" class="icon-btn" aria-label="閉じる">${icon("x")}</button>
        </div>
        <div class="drawer-body">
          <div class="panel">
            <h3>再生成</h3>
            <button type="button" id="copyRegen" class="regen-btn">
              コマンドをコピー
              <code>${escapeHTML(regenCmd)}</code>
            </button>
          </div>
        </div>
        ${foot}`;

      const drawer = document.getElementById("drawer");
      const backdrop = document.getElementById("drawerBackdrop");
      const opener = document.getElementById("manageBtn");

      function setOpen(open) {
        drawer.classList.toggle("open", open);
        backdrop.classList.toggle("open", open);
        drawer.setAttribute("aria-hidden", String(!open));
        if (open) document.getElementById("drawerClose").focus();
        else opener.focus();
      }
      opener.addEventListener("click", () => setOpen(true));
      document.getElementById("drawerClose").addEventListener("click", () => setOpen(false));
      backdrop.addEventListener("click", () => setOpen(false));
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && drawer.classList.contains("open")) setOpen(false);
      });

      document.getElementById("copyRegen").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(regenCmd);
          showToast("コマンドをコピーしました", { kind: "success" });
        } catch (e) {
          showToast("コピーできませんでした", { kind: "error" });
        }
      });

      if (!IS_LOCAL_FILE) {
        document.getElementById("deleteBtn").addEventListener("click", async () => {
          const ok = await deleteVideoRemote(id, entry.title);
          if (ok) location.href = "gallery.html";
        });
      }
    }

    // 字幕(V7): metadata.render.subtitle_cues を TextTrack API で付ける。
    // file:// では <track src> が読めないため、cue を metadata に埋め込んである。
    function attachSubtitles(player, meta) {
      const cues = meta && meta.render && meta.render.subtitle_cues;
      if (!player || !Array.isArray(cues) || cues.length === 0) return;
      try {
        const track = player.addTextTrack("subtitles", "日本語", "ja");
        cues.forEach((c) => track.addCue(new VTTCue(c.start, c.end, String(c.text))));
        track.mode = "showing";
      } catch (e) { /* 字幕が付かないだけ。再生は妨げない */ }
    }

    async function renderDetail() {
      const root = document.getElementById("root");
      const id = new URLSearchParams(location.search).get("id");
      if (!id) {
        root.innerHTML = `<div class="container"><div class="empty-state">動画IDが指定されていません。</div></div>`;
        return;
      }

      let entry, meta;
      try {
        const manifest = await loadManifest();
        entry = manifest.find((v) => v.id === id);
        if (!entry) throw new Error("manifest に該当IDが見つかりません: " + id);
        meta = await loadVideoMetadata(id);
      } catch (e) {
        root.innerHTML = `<div class="container"><div class="empty-state">読み込みエラー: ${escapeHTML(e.message)}</div></div>`;
        return;
      }

      document.title = `${entry.title} — Video Factory`;
      const exportLine = exportSummaryText(entry, meta);
      const usage = tokenConsumptionHTML([entry], { single: true });

      root.innerHTML = `
        <div class="detail-layout">
          <div class="detail-main">
            <div class="player-wrap">
              <video id="player" src="${escapeHTML(entry.video_path)}"
                ${entry.thumbnail_path ? `poster="${escapeHTML(entry.thumbnail_path)}"` : ""} controls></video>
            </div>
            ${chapterTimelineHTML(meta.chapters, entry.duration_sec)}
            ${exportLine ? `<p class="export-summary">${escapeHTML(exportLine)}</p>` : ""}

            <div class="detail-head">
              <h1 class="detail-title">${escapeHTML(entry.title)}</h1>
              <button type="button" id="manageBtn" class="btn">${icon("sliders")}<span>管理</span></button>
            </div>
            <p class="detail-sub">${formatDateShort(entry.created_at)} · ${escapeHTML(sourceLabel(entry.source_tutorial))}</p>
            <div class="tags">${tagsHTML(entry.tags)}</div>
            <p class="detail-summary">${escapeHTML(meta.narration_summary || "")}</p>
          </div>

          <aside class="detail-side">
            <div class="tabs" role="tablist">
              <button type="button" class="tab" role="tab" data-tab="sources" aria-selected="true">出典</button>
              ${meta.chapters && meta.chapters.length ? `<button type="button" class="tab" role="tab" data-tab="chapters" aria-selected="false">章</button>` : ""}
              <button type="button" class="tab" role="tab" data-tab="process" aria-selected="false">生成過程</button>
              ${usage ? `<button type="button" class="tab" role="tab" data-tab="usage" aria-selected="false">使用量</button>` : ""}
            </div>

            <section class="panel" data-panel="sources">
              <h3>RAG出典</h3>
              ${extractionBadgeHTML(meta.quality)}
              ${sourcesHTML(meta.rag_sources)}
            </section>
            ${meta.chapters && meta.chapters.length ? `<section class="panel" data-panel="chapters" hidden><h3>章ごとのメモ</h3>${chapterListHTML(meta.chapters)}</section>` : ""}
            <section class="panel" data-panel="process" hidden>
              <h3>生成プロセス</h3>
              ${stepsHTML(meta.pipeline)}
            </section>
            ${usage ? `<section class="panel" data-panel="usage" hidden><h3>トークン消費量（推定）</h3>${usage}</section>` : ""}
          </aside>
        </div>`;

      root.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => selectTab(root, tab.dataset.tab));
      });
      wireAccordions(root);
      wireChapterTimeline(document.getElementById("player"));
      attachSubtitles(document.getElementById("player"), meta);
      buildDrawer(entry, id);

      const player = document.getElementById("player");
      root.querySelectorAll(".chapter-seek").forEach((btn) => {
        btn.addEventListener("click", () => {
          player.currentTime = Number(btn.dataset.start) || 0;
          player.play().catch(() => {});
        });
      });

      // Keyboard (T6). Arrows jump between chapters (restart the current
      // one first if it has been playing for a while); a video without
      // chapter data falls back to 5-second steps.
      const starts = (meta.chapters || []).map((c) => c.start_sec);
      function jump(dir) {
        if (!starts.length) {
          player.currentTime = Math.max(0, player.currentTime + dir * 5);
          return;
        }
        const t = player.currentTime;
        let cur = 0;
        starts.forEach((s, i) => { if (t >= s - 0.05) cur = i; });
        if (dir > 0) {
          if (cur + 1 < starts.length) player.currentTime = starts[cur + 1];
        } else {
          player.currentTime = t - starts[cur] > 2 || cur === 0 ? starts[cur] : starts[cur - 1];
        }
      }
      initShortcuts({
        Space: () => { player.paused ? player.play().catch(() => {}) : player.pause(); },
        ArrowRight: () => jump(1),
        ArrowLeft: () => jump(-1),
        "/": () => { location.href = "gallery.html#search"; },
        c: () => { if (HAS_COMPARE) location.href = "compare.html"; },
      });
    }

    renderDetail();
  </script>
</body>
</html>
