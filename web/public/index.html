<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Factory</title>
<script>try{var t=localStorage.getItem("vf_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon.ico" sizes="48x48" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)" />
<link rel="stylesheet" href="styles.css" />
</head>
<body class="landing-page">
  <div class="hero-stage">
    <div class="hero-scene" id="heroScene">
      <div class="hero-scene-fallback" id="heroFallback">
        <div class="hero-disc-face"></div>
      </div>
    </div>

    <div class="hero-window">
      <div class="hero-window-titlebar">
        <span class="hero-dot hero-dot-a"></span>
        <span class="hero-dot hero-dot-b"></span>
        <span class="hero-dot hero-dot-a"></span>
      </div>
      <p class="hero-wordmark">Video Factory</p>
      <a class="hero-cta" href="gallery.html">ギャラリーを見る <span>&rsaquo;</span></a>
    </div>
  </div>

  <!-- Classic (non-module) script tags on purpose: this dashboard is opened
       via file:// (VideoHistory::openDashboard() in the desktop app, see
       engine/src/launcher/video_history.cpp), and browsers refuse to fetch
       ES module imports from a file:// document (CORS). A plain <script
       src> to an https CDN is not subject to that restriction, so we pin
       an older Three.js release that still ships a classic global build
       instead of using type="module" + importmap. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="hero-disc.js"></script>
</body>
</html>
