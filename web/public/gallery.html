<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Factory — ギャラリー</title>
<script>try{var t=localStorage.getItem("vf_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="gallery">
  <header id="topbar"></header>

  <main class="container" id="container">
    <section class="hero">
      <h1 class="page-title">生成したチュートリアル動画</h1>
      <dl class="stats" id="stats" hidden></dl>
    </section>

    <section class="featured" id="featured" hidden>
      <h2 class="section-label">まずはここから</h2>
      <div id="featuredCard"></div>
    </section>

    <div class="toolbar" id="toolbar" hidden>
      <div class="toolbar-row">
        <label class="search">
          <span id="searchIcon" aria-hidden="true"></span>
          <input id="search" type="search" placeholder="タイトル・タグで検索" autocomplete="off" aria-label="動画を検索" />
          <kbd class="search-key" aria-hidden="true">/</kbd>
        </label>
        <div class="chips" id="chips"></div>
      </div>
      <div class="toolbar-row">
        <span class="result-count" id="resultCount" aria-live="polite"></span>
        <div class="toolbar-controls">
          <label class="sort">並べ替え
            <select id="sort" class="select">
              <option value="new">新しい順</option>
              <option value="old">古い順</option>
              <option value="short">短い順</option>
              <option value="long">長い順</option>
              <option value="chapters">章数順</option>
              <option value="tokens">トークン順</option>
            </select>
          </label>
          <label class="sort" title="一覧のプレビュー動画の再生です。ナレーションの話速（VOICEVOX）の設定とは別です">プレビュー
            <select id="previewMode" class="select" aria-label="プレビューの再生モード"></select>
            <select id="previewSpeed" class="select" aria-label="プレビューの再生速度"></select>
          </label>
        </div>
      </div>
    </div>

    <p id="stackHint" class="stack-hint" hidden>左右にスワイプして次の動画へ</p>
    <div id="stackBrowser" class="stack-browser" hidden></div>

    <div id="grid" class="grid" aria-live="polite"></div>
    <div id="empty" class="empty-state" hidden></div>

    <section class="panel usage-block" id="usageBlock" hidden>
      <button type="button" class="accordion-head" aria-expanded="false">
        <span>使用量（推定）</span>
      </button>
      <div class="accordion-body"><div><div id="usageBody" style="padding-top:16px"></div></div></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    mountTopbar(`
      <button id="stackToggle" class="btn stack-toggle" type="button">${icon("layers")}<span>カード表示</span></button>
      ${HAS_COMPARE ? `<a class="btn" href="compare.html" title="方式の比較 (C)">${icon("layers")}<span>方式の比較</span></a>` : ""}
      <a class="btn btn-primary" href="random.html">${icon("shuffle")}<span>ランダム再生</span></a>`);

    const grid = document.getElementById("grid");
    const container = document.getElementById("container");
    const empty = document.getElementById("empty");
    const searchInput = document.getElementById("search");
    document.getElementById("searchIcon").innerHTML = icon("search");

    const SORTERS = {
      new: (a, b) => new Date(b.created_at) - new Date(a.created_at),
      old: (a, b) => new Date(a.created_at) - new Date(b.created_at),
      long: (a, b) => b.duration_sec - a.duration_sec,
      short: (a, b) => a.duration_sec - b.duration_sec,
      // chapter_count is absent on videos published before it existed.
      chapters: (a, b) => (b.chapter_count || 0) - (a.chapter_count || 0),
      tokens: (a, b) => (b.estimated_tokens || 0) - (a.estimated_tokens || 0),
    };

    let manifest = [];
    let activeTag = "all";
    let query = "";
    let sortKey = "new";
    let previews = null;
    const prefs = loadPreviewPrefs();

    const norm = (s) => String(s || "").normalize("NFKC").toLowerCase();

    // Skeleton: static blocks holding the card layout while the manifest loads.
    function showSkeleton(n = 6) {
      grid.style.setProperty("--cols", pickColumns(n, container.clientWidth));
      grid.innerHTML = Array.from({ length: n }, () => `
        <div class="skeleton-card" aria-hidden="true">
          <div class="sk-thumb"></div>
          <div class="sk-body"><div class="sk-line"></div><div class="sk-line short"></div></div>
        </div>`).join("");
    }

    function filtersActive() {
      return activeTag !== "all" || query !== "";
    }

    function visibleVideos() {
      const words = norm(query).split(/\s+/).filter(Boolean);
      return manifest
        .filter((v) => activeTag === "all" || (v.tags || []).includes(activeTag))
        .filter((v) => {
          if (!words.length) return true;
          const hay = norm([v.title, ...(v.tags || []), ...(v.tags || []).map(tagLabel)].join(" "));
          return words.every((w) => hay.includes(w));
        })
        .sort(SORTERS[sortKey]);
    }

    function subtitleOf(v) {
      return `${formatDateShort(v.created_at)} · ${formatDuration(v.duration_sec)}${v.chapter_count ? ` · ${v.chapter_count} 章` : ""}`;
    }

    function cardHTML(v, i, animate) {
      return `
        <a class="card ${animate ? "reveal" : ""}" style="--i:${i}" href="video.html?id=${encodeURIComponent(v.id)}" data-video="${escapeHTML(v.video_path)}">
          <div class="thumb">${thumbHTML(v, { duration: false })}</div>
          <div class="card-body">
            <p class="card-title">${escapeHTML(v.title)}</p>
            <p class="card-sub">${subtitleOf(v)}</p>
            <div class="tags">${tagsHTML(v.tags)}</div>
          </div>
        </a>`;
    }

    // "まずはここから": the newest video. Shown only on the unfiltered view
    // (filters are about the list below) and when there is a list to start
    // from -- with one or two videos it would just repeat the grid.
    function renderFeatured() {
      const host = document.getElementById("featured");
      if (filtersActive() || manifest.length < 3) {
        host.hidden = true;
        return;
      }
      const v = [...manifest].sort(SORTERS.new)[0];
      document.getElementById("featuredCard").innerHTML = `
        <a class="card card-featured" href="video.html?id=${encodeURIComponent(v.id)}" data-video="${escapeHTML(v.video_path)}">
          <div class="thumb">${thumbHTML(v, { duration: false })}</div>
          <div class="card-body">
            <p class="card-title">${escapeHTML(v.title)}</p>
            <p class="card-sub">${subtitleOf(v)}</p>
            <div class="tags">${tagsHTML(v.tags)}</div>
          </div>
        </a>`;
      host.hidden = false;
    }

    // Column count follows the item count so the last row is never a lone
    // card; if one still remains it becomes a full-width row.
    function layoutGrid() {
      const cards = [...grid.querySelectorAll(".card")];
      cards.forEach((c) => c.classList.remove("card-wide"));
      const cols = pickColumns(cards.length, grid.clientWidth || container.clientWidth);
      grid.style.setProperty("--cols", cols);
      if (cols > 1 && cards.length > 1 && cards.length % cols === 1) {
        cards[cards.length - 1].classList.add("card-wide");
      }
    }

    function resetFilters() {
      activeTag = "all";
      query = "";
      searchInput.value = "";
      document.querySelectorAll("#chips .chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.tag === "all")));
      renderGrid(false);
    }

    function renderGrid(animate) {
      const list = visibleVideos();

      document.getElementById("resultCount").textContent = filtersActive()
        ? `${manifest.length} 本中 ${list.length} 本を表示`
        : `${manifest.length} 本`;

      renderFeatured();

      if (!list.length) {
        grid.innerHTML = "";
        empty.className = "lost";
        empty.innerHTML = `
          ${beltHTML()}
          <div class="lost-mark">0<span class="dot">本</span></div>
          <p>該当する動画がありません。</p>
          <button type="button" class="btn" id="resetFilters">条件をリセット</button>`;
        empty.hidden = false;
        startSushiBelt(empty);
        document.getElementById("resetFilters").addEventListener("click", resetFilters);
      } else {
        empty.hidden = true;
        grid.innerHTML = list.map((v, i) => cardHTML(v, i, animate)).join("");
        layoutGrid();
      }
      if (previews) previews.refresh();
    }

    function renderStats() {
      const totalSec = manifest.reduce((sum, v) => sum + (v.duration_sec || 0), 0);
      const hours = Math.floor(totalSec / 3600);
      const minutes = Math.max(totalSec > 0 ? 1 : 0, Math.round((totalSec % 3600) / 60));
      const latest = manifest.reduce((max, v) => Math.max(max, new Date(v.created_at).getTime() || 0), 0);
      const stat = (label, valueHTML) => `<div class="stat"><dt>${label}</dt><dd>${valueHTML}</dd></div>`;
      const num = (n) => `<span class="num" data-count="${n}">0</span>`;
      const stats = document.getElementById("stats");
      stats.innerHTML =
        stat("動画", `${num(manifest.length)}<span class="unit">本</span>`) +
        stat(
          "総再生時間",
          (hours > 0 ? `${num(hours)}<span class="unit">時間</span>` : "") + `${num(minutes)}<span class="unit">分</span>`
        ) +
        stat("最終更新", `<span class="num is-text">${latest ? formatDateShort(new Date(latest).toISOString()) : "—"}</span>`);
      stats.hidden = false;
      stats.querySelectorAll(".num[data-count]").forEach((el) => countUp(el, Number(el.dataset.count)));
    }

    function renderChips() {
      const counts = new Map();
      manifest.forEach((v) => (v.tags || []).forEach((t) => counts.set(t, (counts.get(t) || 0) + 1)));
      const chips = document.getElementById("chips");
      const items = [["all", "すべて", manifest.length], ...[...counts].map(([t, n]) => [t, tagLabel(t), n])];
      chips.innerHTML = items
        .map(([key, label, n]) => `
          <button type="button" class="chip" data-tag="${escapeHTML(key)}" aria-pressed="${key === activeTag}">
            ${escapeHTML(label)}<span class="count">${n}</span>
          </button>`)
        .join("");
      chips.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          activeTag = chip.dataset.tag;
          chips.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
          renderGrid(false);
        });
      });
    }

    function wirePreviewControls() {
      const modeSel = document.getElementById("previewMode");
      const speedSel = document.getElementById("previewSpeed");
      modeSel.innerHTML = PREVIEW_MODES.map(([m, label]) => `<option value="${m}">${label}</option>`).join("");
      speedSel.innerHTML = PREVIEW_SPEEDS.map((s) => `<option value="${s}">${s}×</option>`).join("");
      modeSel.value = prefs.mode;
      speedSel.value = String(prefs.speed);
      previews = createPreviewManager(container, prefs);
      modeSel.addEventListener("change", () => {
        prefs.mode = modeSel.value;
        savePreviewPrefs(prefs);
        previews.setMode(prefs.mode);
      });
      speedSel.addEventListener("change", () => {
        prefs.speed = Number(speedSel.value);
        savePreviewPrefs(prefs);
        previews.setSpeed(prefs.speed);
      });
      previews.refresh();
    }

    function wireStackToggle() {
      const stackToggle = document.getElementById("stackToggle");
      const stackBrowser = document.getElementById("stackBrowser");
      const stackHint = document.getElementById("stackHint");
      let stackInitialized = false;
      stackToggle.addEventListener("click", () => {
        const showingStack = stackBrowser.hidden;
        stackToggle.classList.toggle("active", showingStack);
        stackBrowser.hidden = !showingStack;
        stackHint.hidden = !showingStack;
        grid.hidden = showingStack;
        if (showingStack && !stackInitialized) {
          initStackBrowser(stackBrowser, visibleVideos());
          stackInitialized = true;
        }
      });
    }

    // Left/right moves focus between the visible cards (Enter opens one).
    function moveCardFocus(delta) {
      const cards = [...grid.querySelectorAll(".card")];
      if (!cards.length) return false;
      const current = cards.indexOf(document.activeElement);
      const next = current < 0 ? (delta > 0 ? 0 : cards.length - 1) : Math.min(cards.length - 1, Math.max(0, current + delta));
      cards[next].focus();
      cards[next].scrollIntoView({ block: "nearest" });
    }

    async function init() {
      showSkeleton();

      try {
        manifest = await loadManifest();
      } catch (e) {
        grid.innerHTML = "";
        empty.textContent = "manifest を読み込めませんでした: " + e.message;
        empty.hidden = false;
        return;
      }

      if (!manifest.length) {
        grid.innerHTML = "";
        empty.className = "lost";
        empty.innerHTML = `
          ${beltHTML()}
          <div class="lost-mark">0<span class="dot">本</span></div>
          <p>まだ動画がありません。RAGReel で最初の1本を作りましょう。</p>`;
        empty.hidden = false;
        startSushiBelt(empty);
        return;
      }

      renderStats();
      renderChips();
      document.getElementById("toolbar").hidden = false;
      wirePreviewControls();
      renderGrid(true);

      const usage = tokenConsumptionHTML(manifest);
      if (usage) {
        const block = document.getElementById("usageBlock");
        document.getElementById("usageBody").innerHTML = usage;
        block.querySelector(".accordion-head").insertAdjacentHTML("beforeend", icon("chevron-down", "chev"));
        block.hidden = false;
        wireAccordions(block);
      }

      document.getElementById("sort").addEventListener("change", (e) => {
        sortKey = e.target.value;
        renderGrid(false);
      });
      searchInput.addEventListener("input", () => {
        query = searchInput.value.trim();
        renderGrid(false);
      });
      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          searchInput.value = "";
          query = "";
          renderGrid(false);
          searchInput.blur();
        }
      });
      wireStackToggle();

      if (window.ResizeObserver) {
        new ResizeObserver(() => layoutGrid()).observe(container);
      } else {
        window.addEventListener("resize", layoutGrid);
      }

      // Arriving from another page's "/" (gallery.html#search).
      if (location.hash === "#search") {
        searchInput.focus();
      }
    }

    initShortcuts({
      "/": () => {
        searchInput.focus();
        searchInput.select();
      },
      c: () => {
        if (HAS_COMPARE) location.href = "compare.html";
      },
      ArrowLeft: () => moveCardFocus(-1),
      ArrowRight: () => moveCardFocus(1),
    });

    init();
  </script>
</body>
</html>
