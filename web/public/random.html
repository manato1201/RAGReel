<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Factory — ランダム再生</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="shuffle-page">
  <div class="shuffle-stage">
    <video id="player" autoplay muted playsinline></video>
  </div>

  <div class="shuffle-overlay shuffle-overlay-top">
    <a class="shuffle-back" id="backLink" href="gallery.html"></a>
    <span class="shuffle-kicker" id="kicker"></span>
    <span id="count" class="shuffle-count"></span>
  </div>

  <div class="shuffle-overlay shuffle-overlay-bottom">
    <div class="shuffle-info" id="info">
      <p id="title" class="shuffle-title"></p>
      <div id="tags" class="shuffle-tags tags"></div>
    </div>
    <div class="shuffle-buttons">
      <button id="muteBtn" class="shuffle-btn" type="button" title="ミュート切り替え (M)" aria-label="ミュート切り替え"></button>
      <button id="nextBtn" class="shuffle-btn primary" type="button" title="次の動画 (→)" aria-label="次の動画"></button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Random "gacha" play: shuffle the manifest, autoplay each video muted
    // (browsers block unmuted autoplay without a user gesture), auto-advance
    // on end, and reshuffle-without-immediate-repeat once the queue is
    // exhausted so this can just run indefinitely. The info card pops on
    // every draw -- the one playful motion this page uses.
    injectIconSprite();
    document.getElementById("backLink").innerHTML = `${icon("arrow-left")}<span>ギャラリー</span>`;
    document.getElementById("kicker").innerHTML = `${icon("shuffle")}<span>ランダム再生中</span>`;
    document.getElementById("nextBtn").innerHTML = icon("skip-next");

    function shuffle(array) {
      const a = array.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    let manifest = [];
    let queue = [];
    let queuePos = 0;
    let playedCount = 0;

    const video = document.getElementById("player");
    const info = document.getElementById("info");
    const titleEl = document.getElementById("title");
    const tagsEl = document.getElementById("tags");
    const countEl = document.getElementById("count");
    const muteBtn = document.getElementById("muteBtn");
    const nextBtn = document.getElementById("nextBtn");

    function syncMuteIcon() {
      muteBtn.innerHTML = icon(video.muted ? "volume-off" : "volume");
    }
    syncMuteIcon();

    function refillQueueIfNeeded() {
      if (queuePos >= queue.length) {
        const last = queue[queue.length - 1];
        let reshuffled = shuffle(manifest);
        // Avoid the same video playing twice back-to-back across a reshuffle.
        if (manifest.length > 1 && reshuffled[0].id === last?.id) {
          [reshuffled[0], reshuffled[1]] = [reshuffled[1], reshuffled[0]];
        }
        queue = reshuffled;
        queuePos = 0;
      }
    }

    function playCurrent() {
      const entry = queue[queuePos];
      video.src = entry.video_path;
      video.play().catch(() => {
        // Autoplay can still be rejected by some browsers even when muted
        // (e.g. reduced-motion settings) -- leaving the frame paused with
        // controls visible is a reasonable fallback rather than erroring.
      });
      titleEl.textContent = entry.title;
      tagsEl.innerHTML = tagsHTML(entry.tags);
      playedCount += 1;
      countEl.textContent = `${playedCount} 本目 / 全 ${manifest.length} 本からシャッフル中`;

      info.classList.remove("pop");
      void info.offsetWidth; // restart the animation on every draw
      info.classList.add("pop");
    }

    function playNext() {
      queuePos += 1;
      refillQueueIfNeeded();
      playCurrent();
    }

    video.addEventListener("ended", playNext);
    nextBtn.addEventListener("click", playNext);

    muteBtn.addEventListener("click", () => {
      video.muted = !video.muted;
      syncMuteIcon();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") {
        e.preventDefault();
        playNext();
      } else if (e.key === "m") {
        muteBtn.click();
      }
    });

    async function start() {
      try {
        manifest = await loadManifest();
      } catch (e) {
        titleEl.textContent = "manifest を読み込めませんでした: " + e.message;
        return;
      }
      if (!manifest.length) {
        titleEl.textContent = "まだ生成された動画がありません。";
        return;
      }
      queue = shuffle(manifest);
      queuePos = 0;
      playCurrent();
    }

    start();
  </script>
</body>
</html>
